name: career-assistant

x-app-environment: &app-environment
  CAREER_HOME: /app
  RADAR_DATA_DIR: /app/data
  RADAR_DB_PATH: /app/data/radar.db
  RADAR_CONFIG_PATH: /app/config.yaml
  TASK_BACKEND: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TASK_TOPIC: career-assistant.tasks
  KAFKA_DLQ_TOPIC: career-assistant.tasks.dlq
  KAFKA_CONSUMER_GROUP: career-assistant-workers

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: career-assistant:kafka
  env_file:
    - path: .env.docker
      required: false
  environment: *app-environment
  volumes:
    - career-data:/app/data
    - ./config.yaml:/app/config.yaml:ro
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    <<: *app-service
    command: ["web", "--host", "0.0.0.0", "--port", "5000", "--schedule"]
    ports:
      - "${CAREER_WEB_PORT:-5000}:5000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-service
    command: ["worker"]
    depends_on:
      kafka:
        condition: service_healthy
      web:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["ui"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: career-assistant
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  career-data:
  kafka-data:
